image:
  repository: platform-controller
  tag: latest
  pullPolicy: IfNotPresent

userForNonRootSecurityContext: 65532

nodeSelector:
  node-role.kubernetes.io/worker: worker

serviceAccount:
  create: true
  name: platform-controller

rbac:
  create: true
  clusterWide: true
  name: platform-controller
  rules:
    # External Secrets Operator CRDs ONLY (Zero access to native K8s Secrets)
    - apiGroups: ["external-secrets.io"]
      resources: ["secretstores", "externalsecrets"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Secrets Store CSI Driver CRDs ONLY
    - apiGroups: ["secrets-store.csi.x-k8s.io"]
      resources: ["secretproviderclasses"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  namespacedRules:
    # Scoped strictly to platform-controller-auth in platform-system namespace
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["create"]
    - apiGroups: [""]
      resources: ["secrets"]
      resourceNames: ["platform-controller-auth"]
      verbs: ["get", "update", "patch"]

env:
  VAULT_ADDR: "http://vault.external-secrets.svc:8200"
  LOG_FORMAT: "json"
  LOG_LEVEL: "info"

deploys:
  - fullnameOverride: platform-controller
    replicasCount: 1
    command:
      - /usr/local/bin/platform-controller
    args:
      - server
      - --port=8080
      - --vault-addr=http://vault.external-secrets.svc:8200
      - --vault-server=http://vault.external-secrets.svc:8200
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    service:
      type: ClusterIP
      port: 8080
      containerPort: 8080
      health:
        httpLive: /healthz
        httpReady: /readyz
        livenessInitialDelaySeconds: 3
        readinessInitialDelaySeconds: 3
        readinessPeriodSeconds: 5

ingress:
  enabled: true
  type: nginx
  ingressClass: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/server-tokens: "false"
  tls:
    - secretName: devopspro-tls
      hosts:
        - platform-controller.devops.pro
  rules:
    - host: platform-controller.devops.pro
      paths:
        - path: /api/v1/secret
          pathType: Prefix
          serviceName: platform-controller
          servicePort: main
