apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: credentials-bot-manager-calico
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: credentials-bot-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controllers and local namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # 1. Allow Vault endpoint (port 8200)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    # 2. Allow CoreDNS (port 53)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 3. Allow Kubernetes API server
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
