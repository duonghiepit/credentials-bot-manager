apiVersion: v1
kind: Pod
metadata:
  name: app-es-demo
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: app-es-demo
    platform.io/secret-type: external-secrets
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "=============================================="
          echo "  APP 1: EXTERNAL SECRETS (ES) WORKLOAD"
          echo "=============================================="
          echo "APP_ENV:        $APP_ENV"
          echo "APP_NAME:       $APP_NAME"
          echo "APP_PORT:       $APP_PORT"
          echo "REDIS_HOST:     $REDIS_HOST"
          echo "REDIS_PASSWORD: $REDIS_PASSWORD"
          echo "=============================================="
          while true; do sleep 3600; done
      envFrom:
        - secretRef:
            name: app-config
        - secretRef:
            name: redis
