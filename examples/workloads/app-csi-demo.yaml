apiVersion: v1
kind: Pod
metadata:
  name: app-csi-demo
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: app-csi-demo
    platform.io/secret-type: csi-driver
spec:
  serviceAccountName: default
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "=============================================="
          echo "  APP 2: SECRETS STORE CSI DRIVER WORKLOAD"
          echo "=============================================="
          echo "Database secret mounted in tmpfs RAM at /mnt/secrets-store/database:"
          echo "----------------------------------------------"
          cat /mnt/secrets-store/database
          echo ""
          echo "----------------------------------------------"
          echo "Listing /mnt/secrets-store:"
          ls -la /mnt/secrets-store
          echo "=============================================="
          while true; do sleep 3600; done
      volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
  volumes:
    - name: secrets-store-inline
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "vault-ecommerce-csi"
